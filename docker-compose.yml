services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-deepseek-harness}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in Coolify}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:-deepseek-harness}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: "--accept-dns=true --ssh=false --advertise-tags=tag:ai"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - /dev/net/tun:/dev/net/tun
    configs:
      - source: tailscale-serve
        target: /config/serve.json
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 5s
      retries: 10

  dind:
    image: docker:27-dind
    privileged: true
    depends_on:
      tailscale:
        condition: service_healthy
    network_mode: service:tailscale
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - dind-data:/var/lib/docker
      - dind-certs:/certs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  harness:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.5}
        PNPM_VERSION: ${PNPM_VERSION:-11.7.0}
        DSH_SUPERAGENT_REPOSITORY: ${DSH_SUPERAGENT_REPOSITORY:-https://github.com/deepseek-ai/dsh-superagent-prototype.git}
        DSH_SUPERAGENT_REF: ${DSH_SUPERAGENT_REF:-6337fc823ce20251c8de8085948165c81aaa701e}
    depends_on:
      tailscale:
        condition: service_healthy
      dind:
        condition: service_healthy
    network_mode: service:tailscale
    environment:
      USERNAME: dev
      SSH_AUTHORIZED_KEYS: ${SSH_AUTHORIZED_KEYS:?Set SSH_AUTHORIZED_KEYS in Coolify}
      DSH_HOME: /home/dev/.dsh
      DSH_TELEMETRY_DISABLED: ${DSH_TELEMETRY_DISABLED:-1}
      DSH_TOOLS_MODE: ${DSH_TOOLS_MODE:-native}
      DSH_PERMISSION_MODE: ${DSH_PERMISSION_MODE:-workspace-write}
      # Optional override. When empty, entrypoint discovers the full MagicDNS
      # hostname from the healthy Tailscale sidecar.
      DSH_TRUSTED_HOST: ${DSH_TRUSTED_HOST:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DOCKER_HOST: tcp://127.0.0.1:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      TZ: Europe/Berlin
    volumes:
      - dev-home:/home/dev
      - workspace:/home/dev/workspace
      - ssh-host-keys:/etc/ssh/hostkeys
      - dind-certs:/certs:ro
      - tailscale-socket:/var/run/tailscale:ro
    restart: unless-stopped
    healthcheck:
      # dsh web serves GET / as 401 until the printed launch cookie is present.
      # curl -f treats that as failure and Coolify restarts a working UI.
      test: ["CMD-SHELL", "curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/ | grep -qxE '200|401|303'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  # Separate process from the operator Web UI. The bundle changes PATH and git
  # settings for its own process and needs restarts that must not close the
  # operator's sessions. It shares the Tailscale network namespace so Serve
  # can proxy 127.0.0.1:3082 without a public host port.
  superagent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.5}
        PNPM_VERSION: ${PNPM_VERSION:-11.7.0}
        DSH_SUPERAGENT_REPOSITORY: ${DSH_SUPERAGENT_REPOSITORY:-https://github.com/deepseek-ai/dsh-superagent-prototype.git}
        DSH_SUPERAGENT_REF: ${DSH_SUPERAGENT_REF:-6337fc823ce20251c8de8085948165c81aaa701e}
    command: ["serve-superagent"]
    depends_on:
      tailscale:
        condition: service_healthy
      dind:
        condition: service_healthy
    network_mode: service:tailscale
    environment:
      USERNAME: dev
      DSH_HOME: /home/dev/.dsh
      DSH_TELEMETRY_DISABLED: ${DSH_TELEMETRY_DISABLED:-1}
      DSH_TOOLS_MODE: ${DSH_TOOLS_MODE:-native}
      DSH_PERMISSION_MODE: ${DSH_PERMISSION_MODE:-workspace-write}
      DSH_TRUSTED_HOST: ${DSH_TRUSTED_HOST:-}
      DSH_SUPERAGENT_DIR: /opt/dsh-superagent-prototype
      DSH_SUPERAGENT_REPOSITORY: ${DSH_SUPERAGENT_REPOSITORY:-https://github.com/deepseek-ai/dsh-superagent-prototype.git}
      DSH_SUPERAGENT_REF: ${DSH_SUPERAGENT_REF:-6337fc823ce20251c8de8085948165c81aaa701e}
      DSH_SUPERAGENT_AUTO_UPDATE: ${DSH_SUPERAGENT_AUTO_UPDATE:-0}
      DSH_SUPERAGENT_PORT: ${DSH_SUPERAGENT_PORT:-3082}
      DSH_SUPERAGENT_HTTPS_PORT: ${DSH_SUPERAGENT_HTTPS_PORT:-8443}
      DSH_SUPERAGENT_PROFILE: superagent
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DOCKER_HOST: tcp://127.0.0.1:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      TZ: Europe/Berlin
    volumes:
      - dev-home:/home/dev
      - workspace:/home/dev/workspace
      - dind-certs:/certs:ro
      - tailscale-socket:/var/run/tailscale:ro
    restart: unless-stopped
    healthcheck:
      # Same unauthenticated 401 as the operator UI until the launch token is present.
      test: ["CMD-SHELL", "curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3082/ | grep -qxE '200|401|303'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

volumes:
  tailscale-state:
  tailscale-socket:
  dind-data:
  dind-certs:
  dev-home:
  workspace:
  ssh-host-keys:

configs:
  # Embedded because Coolify Git deployments do not reliably preserve relative
  # host bind mounts such as ./tailscale:/config.
  tailscale-serve:
    content: |
      {
        "TCP": {
          "443": {
            "HTTPS": true
          },
          "8443": {
            "HTTPS": true
          }
        },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/": {
                "Proxy": "http://127.0.0.1:3080"
              }
            }
          },
          "$${TS_CERT_DOMAIN}:8443": {
            "Handlers": {
              "/": {
                "Proxy": "http://127.0.0.1:3082"
              }
            }
          }
        },
        "AllowFunnel": {
          "$${TS_CERT_DOMAIN}:443": false,
          "$${TS_CERT_DOMAIN}:8443": false
        }
      }
